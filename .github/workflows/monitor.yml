name: HMRC ORI Monitor

on:
  workflow_dispatch:
  schedule:
  - cron: '17 0 * * *'

permissions:
  contents: write

concurrency:
  group: hmrc-ori-monitor
  cancel-in-progress: false

jobs:
  check-hmrc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Retrieve and compare HMRC rates
        run: python monitor.py

      - name: Save updated rates to GitHub
        run: |
          if ! git diff --quiet -- rates.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rates.json
            git commit -m "Update HMRC ORI rates"
            git push
          else
            echo "No rate changes to save."
          fi
